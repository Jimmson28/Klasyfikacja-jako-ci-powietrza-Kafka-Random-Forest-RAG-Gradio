global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: "api"
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics

  - job_name: "processor"
    static_configs:
      - targets: ["processor:8001"]

  - job_name: "producer"
    static_configs:
      - targets: ["producer:8002"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
